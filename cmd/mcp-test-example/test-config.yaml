# MCP 工具测试配置 - 使用不同端口避免冲突
# 基于 app/dubbo-admin/dubbo-admin.yaml

log:
  level: error  # 只显示错误，减少日志噪音
  outputPath: logs/test.log

# 使用不同端口避免与主实例冲突
console:
  port: 18888  # 不同于默认的 8888
  ginMode: release

# 诊断服务器端口
diagnostics:
  serverPort: 15680  # 不同于默认的 5680

store:
  type: memory

discovery:
  - type: nacos2
    name: nacos2.5-standalone
    id: nacos2.5
    address:
      registry: nacos://101.34.253.152:30848?username=nacos&password=nacos
      configCenter: nacos://101.34.253.152:30848?username=nacos&password=nacos
      metadataReport: nacos://101.34.253.152:30848?username=nacos&password=nacos
    properties:
      configWatchPeriod: 30
      serviceWatchPeriod: 30

engine:
  id: mock
  name: mock
  type: mock
