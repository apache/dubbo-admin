# Example OAuth/OIDC configuration. Replace every placeholder before use.
console:
  port: 8888
  ginMode: release
  auth:
    methods:
      - password
    user: admin
    password: replace-with-admin-password
    expirationTime: 3600
    sessionSecret: replace-with-a-random-secret-at-least-32-bytes
    sessionCookieSecure: true
    providers:
      github:
        type: github
        displayName: GitHub
        iconUrl: /admin/auth-providers/github.svg
        clientId: replace-with-github-client-id
        clientSecret: replace-with-github-client-secret
        redirectUrl: https://admin.example.com/api/v1/auth/providers/github/callback
        postLoginRedirectUrl: https://admin.example.com/admin/
        scopes:
          - read:user
          - user:email
      google:
        type: oidc
        displayName: Google
        iconUrl: /admin/auth-providers/google.svg
        issuer: https://accounts.google.com
        clientId: replace-with-google-client-id
        clientSecret: replace-with-google-client-secret
        redirectUrl: https://admin.example.com/api/v1/auth/providers/google/callback
        postLoginRedirectUrl: https://admin.example.com/admin/
        scopes:
          - openid
          - profile
          - email

store:
  type: memory

discovery:
  - type: mock
    id: mock
    name: mockRegistry

engine:
  id: mock
  name: mock
  type: mock
