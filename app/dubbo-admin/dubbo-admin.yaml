# [Optional] Config for log.
log:
  # [Optional] log level, options are debug, info, warn, error. Optional, default is info.
  level: info
  # [Optional] log file output path, default is ./logs/dubbo-admin.log.
  outputPath: logs/dubbo-admin.log
  # [Optional] max size for a single log file, default is 100, unit is `M`. [Optional]
  maxSize: 100
  # [Optional] max number of old log files to retain, default is 5. [Optional]
  maxBackups: 5
  # [Optional] max age for a log file, default is 3, unit is `day`. [Optional]
  maxAge: 3

# [Optional] config for observability.
observability:
  # [Optional] config for grafana and prometheus.
  grafana: http://101.34.253.152:30300
  # [Optional] config for prometheus.
  prometheus: http://101.34.253.152:30900/
  # [Optional] config for log providers used by MCP log tools.
  # defaultProvider must match one provider name in providers.
  # Currently only Loki is supported. endpoint should be the Loki HTTP API root.
  # tenant is optional and will be sent as X-Scope-OrgID for multi-tenant Loki.
  # logs:
  #   defaultProvider: loki-main
  #   providers:
  #     - name: loki-main
  #       type: loki
  #       endpoint: http://localhost:3100
  #       tenant: ""
  # [Optional] trace providers used by MCP diagnosis tools.
  # The bundled monitoring manifests use the Jaeger query API on port 16686.
  # tracing:
  #   defaultProvider: jaeger-main
  #   providers:
  #     - name: jaeger-main
  #       type: jaeger
  #       endpoint: http://jaeger.monitoring.svc:16686
  #       bearerToken: ""
  #       tenant: ""

# [Optional] config for console.
console:
  # [Optional] port of http server, default is 8888.
  port: 8888
  # [Optional] running mode of Gin, options are debug, release, test, default is release.
  ginMode: release
  # [Optional] dashboard for metrics.
  metricDashboards:
    application: http://101.34.253.152:30300/d/a0b114ca-edf7-4dfe-ac2c-34a4fc545fed?kiosk=1&theme=light
    instance: http://101.34.253.152:30300/d/dcf5defe-d198-4704-9edf-6520838880e9?kiosk=1&theme=light
    service: http://101.34.253.152:30300/d/ec689613-b4a1-45b1-b8bd-9d557059f970?kiosk=1&theme=light
  # [Optional] dashboard for traces.
  traceDashboards:
    application: http://101.34.253.152:30300/d/e968a89b-f03d-42e3-8ad3-930ae815cb0f?kiosk=1&theme=light
    instance: http://101.34.253.152:30300/d/f5f48f75-13ec-489b-88ae-635ae38d8618?kiosk=1&theme=light
    service: http://101.34.253.152:30300/d/b2e178fb-ada3-4d5e-9f54-de99e7f07662?kiosk=1&theme=light
  # [Optional] typical user-pwd authentication, default user-pwd is admin-admin.
  auth:
    user: admin
    password: dubbo@2025
    expirationTime: 3600

# [Optional] config for data storage, default is memory
store:
  # [Optional] store data in memory
  type: memory
  # [Optional, Beta] store data in mysql
#  type: mysql
#  address: root:123456@tcp(127.0.0.1:23306)/dubbo-admin?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai

# [Necessary] configs for service discovery
discovery:
  # [Necessary] discovery type, options are nacos2, zookeeper, mock(only for dev)
  - type: nacos2
  # [Necessary] discovery name, will be displayed in the web ui
    name: nacos2.5-standalone
  # [Necessary] a unique id for this discovery
    id: nacos2.5
  # [Necessary] address config
    address:
      # [Necessary] registry address
      registry: nacos://101.34.253.152:30848?username=nacos&password=nacos
      # [Optional] config center address, if not set, will use registry address
      configCenter: nacos://101.34.253.152:30848?username=nacos&password=nacos
      # [Optional] metadata report address, if not set, will use registry address
      metadataReport: nacos://101.34.253.152:30848?username=nacos&password=nacos
    # [Optional] extra properties
    properties:
      # [Nacos2, Optional] Adjust the interval(time unit is `s`) to adjust the frequency of list-all configs in nacos.
      # Default period is 30s
      configWatchPeriod: 30
      # [Nacos2, Optional] Adjust the interval(time unit is `s`) to adjust the frequency of list-all services in nacos.
      # Default period is 30s
      serviceWatchPeriod: 30
