syntax = "proto3";

package dubbo.mesh.v1alpha1;

option go_package = "github.com/apache/dubbo-admin/api/mesh/v1alpha1";

import "google/protobuf/timestamp.proto";

// RuleIntent records recovery state for a rule mutation before the registry
// write. COMMITTED and FAILED are usually short-lived because the intent is
// cleaned up immediately after the terminal status is written. RuleVersion is
// the durable version record.
message RuleIntent {
  reserved 4;
  reserved "version_no";

  // Parent rule identification
  string parent_rule_kind = 1;
  string parent_rule_mesh = 2;
  string parent_rule_name = 3;

  // Intent metadata
  string content_hash = 5;         // Hash of the intended spec
  string spec_json = 6;            // Snapshot of intended spec
  string operation = 7;            // CREATE, UPDATE, DELETE
  string source = 8;               // ADMIN, UPSTREAM, BOOTSTRAP, ROLLBACK
  string author = 9;               // Who initiated this change
  string reason = 10;              // Why this change was made

  // rolled_back_from_id records the historical version whose snapshot is being
  // re-published. It is audit metadata only and never a current-version pointer.
  int64 rolled_back_from_id = 11;

  // Intent lifecycle. Terminal statuses can remain only when cleanup fails; on
  // restart, repair reconciles open intents from observed resource state.
  string status = 12;              // PENDING, APPLIED, OUTCOME_UNKNOWN, FAILED, COMMITTED
  string failure_reason = 13;      // Error message if status=FAILED
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp applied_at = 15;
  google.protobuf.Timestamp committed_at = 16;

  // Durable reconcile marker written when a non-matching subscriber event is
  // observed while the intent is open. The marker prevents intent cleanup from
  // committing an older snapshot after a real upstream change has arrived.
  bool reconcile_required = 17;
  string observed_content_hash = 18;
  string observed_spec_json = 19;
  string observed_operation = 20;
  google.protobuf.Timestamp observed_at = 21;

  // Monotonic resource revision owned by RuleIntent. Status transitions and
  // observed-marker writes advance it so finalization can reject stale commits
  // instead of overwriting a subscriber reconcile marker.
  int64 revision = 22;
}
