syntax = "proto3";

package dubbo.mesh.v1alpha1;

option go_package = "github.com/apache/dubbo-admin/api/mesh/v1alpha1";

import "api/mesh/options.proto";

// Script execution belongs to the Dubbo runtime, not Admin. Admin validates
// only this configuration contract and does not execute the script. Dubbo-Go
// must provide bounded execution and a failure policy before ScriptRoute is
// enabled in runtime/integration acceptance; see apache/dubbo-go#3566 and
// apache/dubbo-go#3575.
message ScriptRoute {
  option (dubbo.mesh.resource).name = "ScriptRoute";
  option (dubbo.mesh.resource).plural_name = "ScriptRoutes";
  option (dubbo.mesh.resource).package = "mesh";
  option (dubbo.mesh.resource).is_experimental = false;

  string configVersion = 1;
  string scope = 2;
  string key = 3;
  bool enabled = 4;
  string type = 5;
  string script = 6;
}
