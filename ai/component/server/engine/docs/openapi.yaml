openapi: 3.0.1
info:
  title: Agent
  description: ""
  version: 1.0.0
tags:
  - name: 聊天
  - name: 会话管理
paths:
  /ai/memory-options:
    get:
      summary: 当前用户的记忆项目与任务选项
      description: 只返回授权项目的稳定 ID，不暴露租户或成员列表；项目选择不构成工具授权。
      responses:
        "200":
          description: 选项列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projects:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: string}
                      task_types:
                        type: array
                        items: {type: string, enum: [diagnosis, configuration, inspection]}
        "401":
          description: 需要认证
        "503":
          description: 存储或自定义项目目录的选项能力不可用
  /ai/chat/stream:
    post:
      summary: 流式聊天
      deprecated: false
      description: >-
        使用Server-Sent Events实现流式聊天。先创建Session，再通过请求体的sessionID传递会话ID。
        必须提供Idempotency-Key；新的逻辑请求使用新key，同一请求重试时复用原key及请求体。
        已完成请求会重放保存的结果，不重复执行模型。
        matchContext 是可选的记忆适用条件，不构成资源或工具授权；缺省时不继承项目。
      operationId: streamChat
      tags:
        - 聊天
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - message
                - sessionID
              properties:
                message:
                  type: string
                  description: 用户消息
                sessionID:
                  type: string
                  description: 会话 ID
                matchContext:
                  $ref: '#/components/schemas/MatchContext'
            example:
              message: 你是谁
              sessionID: session_test
      responses:
        "200":
          description: 流式响应
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
              example: >
                event: start

                data:
                {"session_id":"sess_20240118143022_abcd1234","status":"processing"}


                event: message_start

                data:
                {"type":"message_start","message":{"id":"msg_sess_123_1642512185000","role":"assistant","type":"message","session_id":"sess_123"}}


                event: content_block_start

                data:
                {"type":"content_block_start","index":0,"content_block":{"type":"text"}}


                event: content_block_delta

                data:
                {"type":"content_block_delta","index":0,"delta":{"text":"正在分析"}}


                event: content_block_delta

                data:
                {"type":"content_block_delta","index":0,"delta":{"text":"服务调用链路..."}}


                event: content_block_stop

                data: {"type":"content_block_stop","index":0}


                event: message_delta

                data:
                {"type":"message_delta","delta":{"stop_reason":"end_turn"}}


                event: message_stop

                data: {"type":"message_stop"}


                event: done

                data: {"status":"completed"}
          headers:
            X-Session-ID:
              description: 会话ID，用于后续对话
              schema:
                type: string
                example: sess_20240118143022_abcd1234
            X-Interaction-ID:
              description: Stable interaction ID reused by idempotent retries
              schema:
                type: string
        "409":
          description: Idempotency conflict or active Session interaction
        "429":
          description: Conversation storage quota exhausted
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                message: "Invalid request: message is required"
                request_id: req_20240118143022_abcd12
                timestamp: 1642512185
          headers: {}
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                message: "AI processing failed: model unavailable"
                request_id: req_20240118143022_abcd12
                timestamp: 1642512185
          headers: {}
      security: []
  /ai/sessions:
    post:
      summary: 创建会话
      deprecated: false
      description: 创建新的聊天会话
      operationId: createSession
      tags:
        - 会话管理
      parameters: []
      responses:
        "200":
          description: 会话创建成功
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                message: success
                data:
                  session_id: sess_20240118143022_abcd1234
                  created_at: "2024-01-18T14:30:22Z"
                  updated_at: "2024-01-18T14:30:22Z"
                  message_count: 0
                  status: active
                request_id: req_20240118143022_efgh56
                timestamp: 1642512185
          headers: {}
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                message: "AI processing failed: model unavailable"
                request_id: req_20240118143022_abcd12
                timestamp: 1642512185
          headers: {}
      security: []
    get:
      summary: 列出会话
      deprecated: false
      description: 获取所有活跃会话列表
      operationId: listSessions
      tags:
        - 会话管理
      parameters: []
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
      security: []
  /ai/sessions/{sessionId}:
    get:
      summary: 获取会话信息
      deprecated: false
      description: 获取特定会话的详细信息
      operationId: getSession
      tags:
        - 会话管理
      parameters:
        - name: sessionId
          in: path
          description: 会话ID
          required: true
          example: ""
          schema:
            type: string
            example: sess_20240118143022_abcd1234
      responses:
        "200":
          description: 会话信息
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
        "404":
          description: 资源未找到
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                message: Session not found
                request_id: req_20240118143022_abcd12
                timestamp: 1642512185
          headers: {}
      security: []
    delete:
      summary: 删除会话
      deprecated: false
      description: 删除指定的会话及其所有历史记录
      operationId: deleteSession
      tags:
        - 会话管理
      parameters:
        - name: sessionId
          in: path
          description: 会话ID
          required: true
          example: ""
          schema:
            type: string
            example: sess_20240118143022_abcd1234
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
        "404":
          description: 资源未找到
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                message: Session not found
                request_id: req_20240118143022_abcd12
                timestamp: 1642512185
          headers: {}
      security: []
  /ai/memories:
    get:
      summary: 当前用户的记忆列表
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 128, default: 32}}
      responses:
        '200': {description: 'data 包含 generation、state_version、enabled、records 和 next_cursor'}
    post:
      summary: 显式确认创建记忆；相同身份和值重复保存幂等
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryWrite'}
      responses:
        '200': {description: 'data 返回当前记录及 version'}
        '400': {description: 'MEMORY_INVALID'}
        '404': {description: 'RESOURCE_NOT_ACCESSIBLE'}
        '409': {description: 'MEMORY_VERSION_CONFLICT 或 MEMORY_DISABLED'}
        '429': {description: 'RESOURCE_EXHAUSTED'}
  /ai/memories/{memoryId}:
    parameters:
      - {name: memoryId, in: path, required: true, schema: {type: string}}
    put:
      summary: 按版本更新记忆；不会隐式创建已删除的记录
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryWrite'}
      responses:
        '200': {description: 'data 返回当前记录及 version'}
        '409': {description: 'MEMORY_VERSION_CONFLICT 或 MEMORY_DISABLED'}
    delete:
      summary: 删除单条记忆
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryMutation'}
      responses:
        '200': {description: '删除成功；规范聊天历史保留'}
        '409': {description: 'MEMORY_VERSION_CONFLICT'}
  /ai/memories/clear:
    post:
      summary: 原子清空当前用户记忆并递增 generation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryMutation'}
      responses:
        '200': {description: 'data 返回新的 generation、state_version 和 enabled'}
        '409': {description: 'MEMORY_VERSION_CONFLICT'}
  /ai/memory-settings:
    get:
      summary: 获取当前用户的记忆状态及并发控制版本
      responses:
        '200': {description: 'data 包含 generation、state_version 和 enabled'}
    put:
      summary: 启用或禁用记忆；禁用保留记录但阻止注入和保存
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryMutation'}
      responses:
        '200': {description: 'data 返回新的状态及版本'}
        '409': {description: 'MEMORY_VERSION_CONFLICT'}
components:
  schemas:
    MatchContext:
      type: object
      additionalProperties: false
      properties:
        projectRef: {type: string, maxLength: 128, description: 服务端目录中的稳定项目 ID}
        taskType: {type: string, enum: [diagnosis, configuration, inspection]}
    MemoryWrite:
      type: object
      additionalProperties: false
      required: [generation, state_version, scope_type, memory_type, fact_key, value]
      properties:
        generation: {type: integer, minimum: 1}
        state_version: {type: integer, minimum: 1}
        version: {type: integer, minimum: 1, description: 更新时必填}
        scope_type: {type: string, enum: [user]}
        memory_type: {type: string, enum: [preference, task_context, diagnostic_constraint]}
        fact_key: {type: string, enum: [response.language, response.style, project.background, diagnostic.priority, diagnostic.read_only]}
        value: {type: string, minLength: 1, description: 默认最多 4096 UTF-8 字节；diagnostic.read_only 仅接受字符串 true}
        applicability: {$ref: '#/components/schemas/MatchContext'}
        source_session_id: {type: string, maxLength: 64, description: 可选且创建后不可变；必须属于当前用户}
        expires_at: {type: string, format: date-time}
    MemoryMutation:
      type: object
      additionalProperties: false
      required: [generation, state_version]
      properties:
        generation: {type: integer, minimum: 1}
        state_version: {type: integer, minimum: 1}
        version: {type: integer, minimum: 1, description: 单条删除时必填}
        enabled: {type: boolean, description: 仅设置接口接受，且必须提供}
  securitySchemes: {}
servers:
  - url: /api/v1
security: []
