type: rag
spec:
  embedder:
    type: genkit
    spec:
      model: dashscope/text-embedding-v4

  loader:
    type: local
    spec: {}

  splitter:
    type: recursive
    spec:
      chunk_size: 1000
      overlap_size: 100

  indexer:
    type: pinecone
    spec:
      storage_path: "../../data/ai/index"
      index_format: sqlite
      dimension: 1536

  retriever:
    type: pinecone
    spec:
      storage_path: "../../data/ai/index"
      index_format: sqlite
      dimension: 1536

  reranker:
    type: cohere
    spec:
      enabled: false
      model: rerank-english-v3.0
      api_key: "${COHERE_API_KEY}"
