type: agent
spec:
  agent_type: "react"
  model: "dashscope/qwen3.5-plus"
  prompt_base_path: "./prompts"
  max_iterations: 10
  stage_channel_buffer_size: 5
  mcp_host_name: "mcp_host"

  stages:
    - name: "think"
      flow_type: "think"
      prompt_file: "agentThink.txt"
      temperature: 0.7
      top_p: 0.9
      max_tokens: 2000
      timeout: 60
      enable_tools: true

    - name: "act"
      flow_type: "act"
      prompt_file: "agentAct.txt"
      temperature: 0.7
      top_p: 0.9
      max_tokens: 3000
      timeout: 90
      enable_tools: true

    - name: "observe"
      flow_type: "observe"
      prompt_file: "agentObserve.txt"
      temperature: 0.7
      top_p: 0.9
      max_tokens: 2000
      timeout: 60
      enable_tools: false
