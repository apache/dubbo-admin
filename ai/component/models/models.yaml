type: models
spec:
  default_model: "dashscope/qwen-max"
  default_embedding: "dashscope/text-embedding-v4"
  providers:
    dashscope:
      api_key: "${DASHSCOPE_API_KEY}"
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      # Endpoint quirks. Applied to every model below unless a model overrides
      # an individual field. See component/models/compat.go for the semantics of
      # each key and the evidence behind its default.
      compat:
        # Qwen spells the thinking switch as a top-level enable_thinking.
        thinking_format: "qwen"
        # Cap thinking tokens. Thinking and the answer share max_tokens, so an
        # uncapped reasoning-heavy turn can emit neither an answer nor a tool
        # call, which just spins the next iteration of the agent loop.
        thinking_budget_field: "thinking_budget"
        # "max_tokens" is understood by a much wider set of endpoints than
        # "max_completion_tokens".
        max_tokens_field: "max_tokens"
        # Only "system" is accepted here.
        supports_developer_role: false
        # The Qwen family rejects tool definitions carrying "strict".
        supports_strict_mode: false
        # Measured 2026-10-04: "required" is not enforced, and not rejected
        # either — asked a question needing no tool, "required" and "auto"
        # behaved identically, both answering in prose. So an agent that
        # depends on forcing gets no error and no tool call.
        supports_forced_tool_choice: false
        # Unverified for this endpoint. The empty <think></think> block ahead
        # of a tool call was observed with Ollama + Qwen3, not here; this is
        # set defensively and has no effect until the streaming path consumes
        # it.
        ignore_leading_whitespace: true
      models:
        - name: "qwen-max"
          key: "qwen-max"
          type: "chat"
        - name: "qwen-plus"
          key: "qwen-plus"
          type: "chat"
        - name: "qwen3.5-plus"
          key: "qwen3.5-plus"
          type: "chat"
        - name: "qwen-flash"
          key: "qwen-flash"
          type: "chat"
        - name: "qwen3-coder"
          key: "qwen3-coder-plus"
          type: "code"
        - name: "qwen3.5-flash"
          key: "qwen3.5-flash"
          type: "chat"
      embedders:
        - name: "qwen3-embedding"
          key: "text-embedding-v4"
          type: "text"
          dimensions: 1024

    gemini:
      api_key: "${GEMINI_API_KEY}"
      base_url: "https://generativelanguage.googleapis.com/v1beta"
      models:
        - name: "gemini-pro"
          key: "gemini-pro"
          type: "chat"
        - name: "gemini-pro-vision"
          key: "gemini-pro-vision"
          type: "multimodal"
      embedders:
        - name: "gemini-embedding"
          key: "text-embedding-004"
          type: "text"
          dimensions: 768

    siliconflow:
      api_key: "${SILICONFLOW_API_KEY}"
      base_url: "https://api.siliconflow.cn/v1"
      # Left unconfigured on purpose: the conservative defaults (max_tokens,
      # system role, no strict, no store) suit an OpenAI-compatible gateway, and
      # guessing from the base URL would be wrong behind a proxy.
      models:
        - name: "gpt-3.5-turbo"
          key: "gpt-3.5-turbo"
          type: "chat"
        - name: "gpt-4"
          key: "gpt-4"
          type: "chat"
      embedders:
        - name: "text-embedding-ada-002"
          key: "text-embedding-ada-002"
          type: "text"
          dimensions: 1536
