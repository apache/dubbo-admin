name: dubbo-admin ci

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    if: github.repository == 'apache/dubbo-admin'
    steps:
      - uses: actions/checkout@v4
      - name: Check License Header
        uses: apache/skywalking-eyes/header@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .licenserc.yaml
          mode: check

  CI:
    name: CI (${{ matrix.os }} - Go ${{ matrix.go_version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # If you want to matrix build , you can append the following list.
      matrix:
        go_version:
          - "1.24"
          - "1.23"
        os:
          - ubuntu-latest
    if: github.repository == 'apache/dubbo-admin'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: ui-vue3/yarn.lock
      - name: Build Frontend (Vue3)
        working-directory: ui-vue3
        run: |
          yarn install --frozen-lockfile
          yarn build
      - name: Copy Dist Directory
        run: cp -r ui-vue3/dist/ app/dubbo-ui/
      - name: Setup Go ${{ matrix.go_version }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check Code Format
        run: make fmt && git status && [[ -z $(git status -s) ]]
      - name: Run Unit Test
        run: make test
      # TODO(marsevilspirit): add lint
      - name: Coverage
        # TODO(marsevilspirit): fix coverage
        run: bash <(curl -s https://codecov.io/bash)
