name: RISC-V Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  riscv-build:
    name: RISC-V Build (linux/riscv64)
    runs-on: ubuntu-latest
    if: github.repository == 'apache/dubbo-admin'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: yarn
          cache-dependency-path: ui-vue3/yarn.lock

      - name: Build frontend
        working-directory: ui-vue3
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Copy frontend assets
        run: cp -r ui-vue3/dist/ app/dubbo-ui/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build for linux/riscv64
        env:
          CGO_ENABLED: 0
          GOARCH: riscv64
          GOOS: linux
        run: go build ./...
