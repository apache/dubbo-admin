apiVersion: apps/v1
kind: Deployment
metadata:
  name: dubbo-admin
  labels:
    app: dubbo-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dubbo-admin
  template:
    metadata:
      name: dubbo-admin
      labels:
        app: dubbo-admin
    spec:
      containers:
        - name: dubbo-admin
          image: apache/dubbo-admin:0.7.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - mountPath: /etc/dubbo-admin
              name: dubbo-admin-config
              readOnly: true
          command:
            - -c
            -
          livenessProbe:
            httpGet:
              port: 5680
              path: /healthy
              scheme: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              port: 5680
              path: /ready
              scheme: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          ports:
            - containerPort: 8888
              protocol: TCP
      restartPolicy: Always
      volumes:
        - name: dubbo-admin-config
          configMap:
            name: dubbo-admin-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dubbo-admin-config
  namespace: dubbo-system

data:
  dubbo-admin.yaml: |
    observability:
    # [Optional] config for grafana and prometheus.
    grafana: http://grafana.monitoringg.svc:3000
    # [Optional] config for prometheus.
    prometheus: http://prometheus-k8s.monitoring.svc:9090/
    # [Optional] config for console.
    console:
      metricDashboards:
        application: http://${grafana-public-address}:3000/d/a0b114ca-edf7-4dfe-ac2c-34a4fc545fed?kiosk=1&theme=light
        instance: http://${grafana-public-address}:3000/d/dcf5defe-d198-4704-9edf-6520838880e9?kiosk=1&theme=light
        service: http://${grafana-public-address}:3000/d/ec689613-b4a1-45b1-b8bd-9d557059f970?kiosk=1&theme=light
      # [Optional] dashboard for traces.
      traceDashboards:
        application: http://${grafana-public-address}:3000/d/e968a89b-f03d-42e3-8ad3-930ae815cb0f?kiosk=1&theme=light
        instance: http://${grafana-public-address}:3000/d/f5f48f75-13ec-489b-88ae-635ae38d8618?kiosk=1&theme=light
        service: http://${grafana-public-address}:3000/d/b2e178fb-ada3-4d5e-9f54-de99e7f07662?kiosk=1&theme=light
      # [Optional] typical user-pwd authentication, default user-pwd is admin-admin.
      auth:
        user: admin
        password: dubbo@2025
        expirationTime: 3600
    discovery:
      - type: nacos2
        name: nacos2.5-standalone
        id: nacos2.5
        address:
          registry: nacos://nacos.dubbo-system.svc:8848?username=nacos&password=nacos
          configCenter: nacos://nacos.dubbo-system.svc:8848?username=nacos&password=nacos
          metadataReport: nacos://nacos.dubbo-system.svc:8848?username=nacos&password=nacos
    engine:
      id: default
      name: default
      type: kubernetes
---
apiVersion: v1
kind: Service
metadata:
  name: dubbo-admin
  namespace: dubbo-system
spec:
  type: ClusterIP
  selector:
    app: dubbo-admin
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888