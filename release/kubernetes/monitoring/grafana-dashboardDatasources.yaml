apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/version: 12.1.0
  name: grafana-datasources
  namespace: monitoring
stringData:
  datasources.yaml: |-
    {
        "apiVersion": 1,
        "datasources": [
            {
                "access": "proxy",
                "editable": false,
                "name": "prometheus",
                "orgId": 1,
                "type": "prometheus",
                "uid": "dubbo-admin-prometheus",
                "url": "http://prometheus-k8s.monitoring.svc:9090",
                "version": 1
            },
            {
                "access": "proxy",
                "editable": false,
                "name": "jaeger",
                "orgId": 1,
                "type": "jaeger",
                "uid": "fe670vj54q48wc",
                "url": "http://jaeger.monitoring.svc:16686",
                "jsonData": {
                    "tracesToMetrics": {
                        "datasourceUid": "dubbo-admin-prometheus",
                        "tags": [
                            {"key": "dubbo.application", "value": "application_name"},
                            {"key": "dubbo.metric.interface", "value": "interface"},
                            {"key": "rpc.method", "value": "method"}
                        ],
                        "queries": [
                            {"name": "Provider Request Rate", "query": "sum by (application_name, interface, method) (rate(dubbo_provider_requests_total{$$__tags}[5m]))"},
                            {"name": "Consumer Request Rate", "query": "sum by (application_name, interface, method) (rate(dubbo_consumer_requests_total{$$__tags}[5m]))"}
                        ],
                        "spanStartTimeShift": "-5m",
                        "spanEndTimeShift": "5m"
                    }
                },
                "version": 1
            }
        ]
    }
type: Opaque
