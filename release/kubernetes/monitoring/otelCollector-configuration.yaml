apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: monitoring
data:
  config.yaml: |-
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
    processors:
      k8sattributes:
        auth_type: serviceAccount
        filter:
          namespace: dubbo-samples-shop
        extract:
          metadata:
            - k8s.pod.ip
            - k8s.pod.uid
            - k8s.pod.name
            - k8s.namespace.name
        pod_association:
          - sources:
              - from: connection
    exporters:
      otlp/jaeger:
        endpoint: "jaeger.monitoring.svc:4317"
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8sattributes]
          exporters: [otlp/jaeger]
